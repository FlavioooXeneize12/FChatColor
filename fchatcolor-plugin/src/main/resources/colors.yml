# =====================================================================
#  FChatColor - Available chat colors (colors.yml)
# =====================================================================
# Each entry under "colors" is a name players can use with:
#   /fchatcolor set <name>
#
#   name:       display name of the color: may carry MiniMessage tags
#               (e.g. <white>) or & codes. Returned by the
#               %fchatcolor_color_name% placeholder and accepted as an
#               alternative input for /fchatcolor set. When omitted it
#               defaults to the key.
#   permission: permission node required to use this color.
#               Registered with default "op": admins can use every
#               color; grant nodes such as fchatcolor.color.red to
#               players (fchatcolor.color.* grants them all).
#   value:      color stored in the database: #RRGGBB (hex) or
#               a legacy code such as &c or c. Special value "rainbow"
#               makes the color cycle through the spectrum in chat.
#   material:   item material shown in the /chatcolor menu (default
#               PLAYER_HEAD). Use any Bukkit material name.
#   texture:    skin for PLAYER_HEAD items in the menu. Leave empty for
#               the default head. Accepts:
#                 * a base64 texture string (from a skin site), or
#                 * a 64-char texture hash, or
#                 * a full http(s) textures URL.
#               The base64 value is the usual one and is fully supported.
#
# Colors are NOT limited to the defaults below: add as many entries as you
# want under "colors" (your own key, name, permission and value); every
# entry is loaded on /fchatcolor reload.
#
# /fchatcolor reload reloads this file. Names not listed here still
# work if typed as #RRGGBB or a legacy code (&9), subject to
# fchatcolor.chat.hex.
#
# This file ships inside the jar and is copied to plugins/FChatColor/
# on the first startup (and again on /fchatcolor reload if you delete it).

