# =====================================================================
#  FChatColor - Main configuration
# =====================================================================
# Chat behaviour is fixed (not configurable):
#   * Color codes are written with '&' (&a, &#FF55FF, <blue>).
#   * Codes typed by the player are always translated.
#   * The color chosen with /fchatcolor set always applies to their messages.
# Messages are edited in messages.yml.

menu:
  # Whether the /chatcolor GUI menu is enabled.
  # When false, /chatcolor and /fchatcolor menu will show a message instead of opening the inventory.
  enabled: true

chat:
  # Default color applied to players with no selection, or whose selected color permission was revoked.
  # Use a key from colors.yml (e.g. "white"), a hex "#RRGGBB", a legacy code "a" / "&a", "rainbow", or "" to disable.
  default-color: white

  # Per-permission defaults: if the player has no selected color (or its permission was revoked),
  # the first permission they have in this map wins. This lets you set e.g. "fchatcolor.default-color.red"
  # -> "red" so a player who loses "fchatcolor.color.green" will fall back to red instead of white.
  # The global default-color above is used if no permission matches.
  default-permission-colors:
    "fchatcolor.default-color.hades": "#ffc504"
    "fchatcolor.default-color.mega": "#77ff04"
    "fchatcolor.default-color.super": "#ff04d0"
  #  "fchatcolor.default-color.vip": "#FF55FF"
  #  "fchatcolor.default-color.rainbow": "rainbow"

  # Modes enabled to pick a color with /fchatcolor set.
  # The player also needs the matching permission and the server
  # must support it.
  modes:
    legacy: true
    hex: true
    minimessage: true

  # Verbose debug logging to console (placeholder resolve, chat pipeline, storage). Default false.
  debug: false

database:
  # SQLITE (local file, nothing to install) or MYSQL (MySQL/MariaDB server)
  type: SQLITE

  # Repeated chat lookups are cached in memory for this time (ms).
  # Set 0 to disable the cache (more database queries).
  # Tuned for large servers (1000+ players): higher values reduce DB hits
  # without stale data risk because the cache is invalidated on every write.
  cache-millis: 60000

  # Number of simultaneous JDBC connections (2-32 recommended).
  # Tuned for large servers: 10 handles burst chat + menu + commands
  # without exhausting the pool. Lower values (4) are fine for small servers.
  pool-size: 10

  # Table name (created automatically)
  table: fchatcolor_colors

  # --- SQLite ---
  sqlite:
    # Path relative to the plugin folder. Use ":memory:" to test.
    file: data.db

  # --- MySQL / MariaDB ---
  mysql:
    host: localhost
    port: 3306
    database: fchatcolor
    username: root
    password: ''
    # Extra JDBC properties separated by ';', e.g. "useSSL=false;allowPublicKeyRetrieval=true"
    properties: ''
